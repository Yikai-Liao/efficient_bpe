[package]
name = "efficient-bpe-rust"
version = "0.1.0"
edition = "2024"
publish = false
description = "Reproducible native baseline for weighted greedy BPE experiments"

[dependencies]
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
sha2 = "=0.10.9"
libc = "=0.2.189"
hotpath = { version = "=0.27.0", optional = true, default-features = false }

[features]
default = []
profiling = ["dep:hotpath", "hotpath/hotpath"]
profiling-cpu = ["profiling", "hotpath/hotpath-cpu"]

[profile.release]
debug = 1
lto = "thin"
codegen-units = 1
