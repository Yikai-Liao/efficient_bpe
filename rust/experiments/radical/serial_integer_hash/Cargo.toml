[package]
name = "radical-serial-integer-hash"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
efficient-bpe-rust = { path = "../../.." }
ahash = "=0.8.12"
serde = { version = "1.0", features = ["derive"] }
